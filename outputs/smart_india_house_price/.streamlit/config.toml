[theme]
base = "light"
primaryColor = "#6C4DF6"
backgroundColor = "#F5F6FF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#18182C"
font = "sans serif"
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
borderColor = "#E2DFF0"
showWidgetBorder = true
showSidebarBorder = false

[theme.sidebar]
primaryColor = "#8A83FF"
backgroundColor = "#0A1020"
secondaryBackgroundColor = "#111A31"
textColor = "#E7E9F3"
borderColor = "#222B42"

[server]
headless = true

[browser]
gatherUsageStats = false
